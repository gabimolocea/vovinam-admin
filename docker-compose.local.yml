# Local venue/LAN stack for competition-day operation.
#
# Starts: PostgreSQL (source of truth during the event), the Django backend,
# and a background scheduler that snapshots the database every 15 minutes so
# you can always go back in time if something goes wrong.
#
# Usage (from the repo root):
#   cp .env.local.example .env.local   # once, then edit LAN_HOST
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#
# See docs/GHID_COMPETITIE_LOCALA.md for the full step-by-step runbook.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-frvv_local}
      POSTGRES_USER: ${DB_USER:-frvv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-frvv_local_password}
    volumes:
      - frvv_local_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-frvv} -d ${DB_NAME:-frvv_local}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: crud.settings_local
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-before-the-event}
      LAN_HOST: ${LAN_HOST:-172.20.10.14}
      IS_LOCAL_EVENT_SERVER: "True"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-frvv_local}
      DB_USER: ${DB_USER:-frvv}
      DB_PASSWORD: ${DB_PASSWORD:-frvv_local_password}
      LOCAL_BACKUP_INTERVAL_MINUTES: ${LOCAL_BACKUP_INTERVAL_MINUTES:-15}
      LOCAL_BACKUP_RETENTION_COUNT: ${LOCAL_BACKUP_RETENTION_COUNT:-200}
      CLOUD_SYNC_BASE_URL: ${CLOUD_SYNC_BASE_URL:-}
      CLOUD_SYNC_USERNAME: ${CLOUD_SYNC_USERNAME:-}
      CLOUD_SYNC_PASSWORD: ${CLOUD_SYNC_PASSWORD:-}
    volumes:
      - frvv_local_media:/app/media
      - frvv_local_backups:/app/local_backups
    ports:
      - "8000:8000"

  # Independent process: keeps taking automatic snapshots even if the
  # backend container is restarted (e.g. after a code/config change).
  backup-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: crud.settings_local
      LAN_HOST: ${LAN_HOST:-172.20.10.14}
      IS_LOCAL_EVENT_SERVER: "True"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-frvv_local}
      DB_USER: ${DB_USER:-frvv}
      DB_PASSWORD: ${DB_PASSWORD:-frvv_local_password}
      LOCAL_BACKUP_INTERVAL_MINUTES: ${LOCAL_BACKUP_INTERVAL_MINUTES:-15}
      LOCAL_BACKUP_RETENTION_COUNT: ${LOCAL_BACKUP_RETENTION_COUNT:-200}
    volumes:
      - frvv_local_backups:/app/local_backups
    entrypoint: ["python", "manage.py", "backup_loop"]

volumes:
  frvv_local_db_data:
  frvv_local_media:
  frvv_local_backups:
