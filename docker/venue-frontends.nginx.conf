# Cele trei interfete din sala, fiecare pe portul ei de dinainte.
#
# Un singur nginx pentru toate trei: sunt fisiere statice, nu are rost un
# container pentru fiecare. Porturile raman cele cu care lumea e obisnuita
# si pe care le afiseaza launcherul.

# `try_files ... /index.html` e singurul lucru care nu e evident aici.
# Aplicatiile isi tin rutele in browser, nu pe server: nu exista niciun
# fisier `/eveniment/12/piramide`. Fara linia asta, o reincarcare de pagina
# sau un semn de carte ar da 404 - adica exact in mijlocul competitiei,
# cand cineva reincarca ecranul ca sa-l "repare".

server {
    listen 5191;
    server_name _;
    root /srv/competition-admin;
    index index.html;

    # Fisierele cu amprenta continutului in nume se pot tine un an: numele
    # lor se schimba odata cu continutul. index.html nu, altfel o versiune
    # noua a aplicatiei n-ar mai ajunge niciodata la tablete.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

