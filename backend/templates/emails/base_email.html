<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title }}{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#e9ecef; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#e9ecef; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#ffffff; padding:24px 32px; border-bottom:1px solid #dce0e5;" align="center">
              <img
                src="{{ logo_url }}"
                width="220"
                alt="Federația Română de Vovinam Việt Võ Đạo"
                style="display:block; max-width:220px; width:100%; height:auto; border:0;"
              >
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px; background-color:#f8f9fa; border-top:1px solid #dce0e5;">
              <p style="margin:0; font-size:12px; color:#00334d99;">
                Primești acest email pentru că ai un cont pe site-ul Federației Române de Vovinam Việt Võ Đạo.
                Poți schimba preferințele de notificare din
                <a href="{{ settings_url }}" style="color:#00334d99; text-decoration:underline;">Contul meu &rarr; Notificări</a>.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
