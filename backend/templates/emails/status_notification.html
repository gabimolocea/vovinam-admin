{% extends "emails/base_email.html" %}

{% block content %}
  <p style="margin:0 0 16px; font-size:15px; color:#00334d;">Bună, {{ recipient_name }},</p>
  <h1 style="margin:0 0 16px; font-size:20px; color:#00334d;">{{ title }}</h1>
  <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#00334d; white-space:pre-line;">{{ message }}</p>
  {% if cta_url %}
  <table role="presentation" cellpadding="0" cellspacing="0">
    <tr>
      <td style="border-radius:6px; background-color:#da3b26;">
        <a href="{{ cta_url }}" style="display:inline-block; padding:12px 24px; font-size:14px; font-weight:bold; color:#ffffff; text-decoration:none; text-transform:uppercase; letter-spacing:0.03em;">
          {{ cta_label|default:"Vezi detalii" }}
        </a>
      </td>
    </tr>
  </table>
  {% endif %}
{% endblock %}
