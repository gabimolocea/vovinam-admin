<div class="central-penalty-modal-content">
  <h2>Adaugă penalizare a arbitrului central</h2>
  <p>Meci: <strong>{{ match.name }}</strong></p>
  <p>Arbitru central: <strong>{{ central_referee.first_name }} {{ central_referee.last_name }}</strong></p>
  <form method="post" novalidate id="central-penalty-form">
    {% csrf_token %}
    <table>
      {{ form.as_table }}
    </table>
    <div class="submit-row">
      <input type="submit" value="Creează penalizarea" class="default" />
      <button type="button" id="central-penalty-cancel">Anulează</button>
    </div>
  </form>
</div>
