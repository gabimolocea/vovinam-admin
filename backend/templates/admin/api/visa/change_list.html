{% extends "admin/change_list.html" %}
{% load i18n %}

{% block extrahead %}
    {{ block.super }}
    <style>
        .change-list .object-tools .addlink:not(.medical):not(.annual) {
            display: none !important;
        }
    </style>
{% endblock %}

{% block object-tools-items %}
    {% if has_add_permission %}
        <li>
            <a href="{% url 'admin:api_visa_add' %}?visa_type=medical" class="addlink medical">Adaugă viză medicală</a>
        </li>
        <li>
            <a href="{% url 'admin:api_visa_add' %}?visa_type=annual" class="addlink annual">Adaugă viză anuală</a>
        </li>
    {% endif %}
    {{ block.super }}
{% endblock %}
