name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Clean old database and run migrations
      run: |
        rm -f db.sqlite3
        python manage.py migrate

    - name: Run tests
      run: python manage.py test api.tests

  # Unit/component tests (Vitest + React Testing Library) for apps/shared,
  # apps/public-site, apps/app and apps/competition-admin - see
  # apps/*/vitest.config.js. Fast, no backend/servers needed.
  frontend-unit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # package-lock.json is generated on macOS, so it only pins the resolved
    # darwin-arm64 rollup binary - the linux-x64-gnu one Vite/Vitest need
    # here only exists inside Rollup's own optionalDependencies metadata,
    # never as an installable lockfile entry (npm/cli#4828). Neither
    # `npm ci` (doesn't even fail on this - it silently installs everything
    # else and only the later `vitest run` blows up requiring it) nor a
    # plain `npm install` with the lockfile still present (npm treats it as
    # authoritative and won't add the missing platform entry either) fixes
    # this - the lockfile has to actually be deleted first so npm does a
    # fresh resolve against this runner's real platform (see also the same
    # fix in the Dockerfile's frontend-builder stage).
    - name: Install dependencies
      run: rm -f package-lock.json && npm install

    - name: Run frontend unit tests
      run: npm run test --workspaces --if-present

  # End-to-end tests (Playwright) for public-site, app and competition-admin
  # - see playwright.config.js and e2e/. Runs real dev servers for all three
  # apps and drives them in a real browser; the Django backend is replaced
  # by page.route() mocks (see e2e/*/*.spec.js), so no database/backend
  # setup is needed here.
  frontend-e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # See the frontend-unit job above for why the lockfile is deleted first.
    - name: Install dependencies
      run: rm -f package-lock.json && npm install

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run e2e tests
      run: npx playwright test

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

