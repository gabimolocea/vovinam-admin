name: Venue release

# Tot ce are nevoie laptopul din sala, scos dintr-o singura apasare:
# imaginile Docker (backend + cele trei interfete) si instalatoarele
# launcherului pentru Mac si pentru Windows, puse intr-un GitHub Release.
#
# Se porneste pe o eticheta de forma v1.2.3, sau manual din fila Actions.
# Etichetarea e deliberat manuala: o versiune noua inseamna ca cineva
# trebuie sa reinstaleze aplicatia pe laptopul din sala, deci nu vrem una
# la fiecare commit.
#
# Imaginile primesc si eticheta versiunii, si `latest`. Launcherul le cere
# pe cele `latest`, nu pe cele cu versiunea lui: asa, un laptop din sala ia
# ultimele imagini chiar daca aplicatia instalata pe el e mai veche, fara
# ca cineva sa trebuiasca sa tina package.json si etichetele git in pas.
#
# Pretul e ca o aplicatie veche poate ajunge sa porneasca un backend nou.
# Launcherul e doar un dirijor - porneste containere, cheama cateva
# endpointuri de sincronizare - deci nu e un pret mare, dar daca vreodata
# se schimba ceva in intelegerea dintre ele, aici e locul de schimbat:
# scrie FRVV_IMAGE_TAG in .env.local din versiunea aplicatiei
# (dockerBackend.js, ensureEnvLocal) si etichetele devin fixe.

# DE FACUT O SINGURA DATA, dupa prima rulare: pachetele publicate in GHCR
# sunt private la inceput. Pe github.com/users/<cont>/packages, la fiecare
# dintre cele doua imagini, Package settings -> Change visibility -> Public.
# Fara pasul asta, laptopul din sala nu le poate descarca si pornirea cade
# cu "denied" - iar mesajul nu spune nicaieri ca e o chestiune de drepturi.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Eticheta de folosit (ex. v1.0.0)'
        required: true

permissions:
  contents: write   # pentru a crea Release-ul
  packages: write   # pentru a publica imaginile in GHCR

env:
  REGISTRY: ghcr.io

jobs:
  # ── Imaginile Docker ────────────────────────────────────────────────
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: vovinam-venue-backend
            dockerfile: backend/Dockerfile.local
            context: ./backend
          - name: vovinam-venue-frontends
            dockerfile: Dockerfile.venue-frontends
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Versiunea
        id: ver
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Runnerele GitHub sunt pe procesoare Intel, iar noi construim si
      # pentru arm64 (Mac-urile noi din sala). Fara emulare, acea parte
      # cade din prima - "exec format error".
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Doua arhitecturi: laptopurile din sala pot fi Mac-uri cu procesor
      # Apple (arm64) sau PC-uri obisnuite (amd64). Fara arm64, Docker ar
      # rula imaginea prin emulare pe Mac-urile noi - merge, dar incet, si
      # tocmai acolo nu vrem surprize.
      - name: Construieste si publica ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.ver.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Instalatoarele launcherului ─────────────────────────────────────
  launcher:
    strategy:
      fail-fast: false   # un esec pe Windows nu trebuie sa ne lase si fara varianta de Mac
      matrix:
        include:
          - os: macos-latest
            artefacte: 'apps/launcher/release/*.dmg'
          - os: windows-latest
            artefacte: 'apps/launcher/release/*.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci`, nu `npm install` dupa stergerea lockfile-ului.
      #
      # Prima incercare stergea lockfile-ul, din cauza problemei cu rollup
      # (npm/cli#4828, vezi mai jos). A iesit mai rau: lockfile-ul fixeaza
      # app-builder-bin pe un alpha anume, iar o rezolvare proaspata ia un
      # alpha mai nou, cu binarele in alta parte decat le cauta
      # electron-builder 25. Construirea cadea pe ambele sisteme cu
      # "spawn .../app-builder-bin/mac/app-builder_arm64 ENOENT".
      - name: Instaleaza dependintele
        run: npm ci

      # Problema cu rollup, rezolvata punctual in loc sa daramam tot
      # lockfile-ul: el e facut pe macOS, deci retine doar binarul rollup
      # pentru darwin-arm64 - npm nu scrie in lockfile dependintele
      # optionale ale celorlalte platforme. Pe runnerul macOS (tot arm64)
      # nu lipseste nimic; pe Windows il adaugam noi, fara sa-l salvam.
      - name: Binarul rollup pentru Windows
        if: runner.os == 'Windows'
        run: npm install --no-save @rollup/rollup-win32-x64-msvc

      - name: Construieste launcherul
        run: npm run build --workspace @vovinam/launcher
        env:
          # Nu avem certificate (vezi documentatia de instalare: aplicatia
          # se deschide cu pasii de ocolire). Fara linia asta,
          # electron-builder incearca sa semneze pe macOS si se opreste.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: ${{ matrix.artefacte }}
          if-no-files-found: error

  # ── Release-ul ──────────────────────────────────────────────────────
  release:
    needs: [images, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacte

      - name: Publica Release-ul
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artefacte/**/*
          body: |
            Instalatoarele pentru laptopul din sala.

            - **Mac** — fisierul `.dmg`
            - **Windows** — fisierul `.exe`

            Pe laptopul din sala mai e nevoie doar de **Docker Desktop**.
            Nu trebuie nici Node, nici codul sursa: launcherul descarca
            singur ce ii trebuie.

            Aplicatia nu e semnata, deci la prima deschidere sistemul
            avertizeaza. Pasii de ocolire, cu poze, sunt in panoul de
            administrare, la **Competitie in sala**.
